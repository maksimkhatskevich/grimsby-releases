name: 🐞 Ошибка
description: Что-то работает не так, как должно
labels: [ошибка]
body:
  - type: input
    id: version
    attributes:
      label: Версия Grimsby
      description: «Настройки → О программе»
      placeholder: например, 1.1.0
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Что случилось
      description: Что вы делали и что пошло не так. Если можно — приложите скриншот.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Как должно было быть
  - type: input
    id: windows
    attributes:
      label: Windows
      placeholder: например, Windows 11
